# The standards repository checks itself with its own workflows, and tests its tools.
# `lint` runs python-lint in its default mode, all (every file), and `lint-changed` in mode changed (the files a
# change touches): this repository is clean, and a change to the workflow is tried in both modes before any project
# takes it. One run per ref (concurrency, below), and the new checks (check-pr-template, check-pre-commit-config)
# are turned on here to prove the opt-in flags work, since this repository now carries both files itself.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    uses: ./.github/workflows/python-lint.yml
    with:
      format-check: true
  lint-changed:
    uses: ./.github/workflows/python-lint.yml
    with:
      format-check: true
      mode: changed
  shell:
    uses: ./.github/workflows/shell-lint.yml
    with:
      runs-on: '["ubuntu-latest"]'   # the JSON-list form a self-hosted runner uses
  workflows:
    uses: ./.github/workflows/actionlint.yml
  standards:
    uses: ./.github/workflows/standards-check.yml
    with:
      check-pr-template: true
      check-pre-commit-config: true
  # TEMPORARY (removed before this pull request is ready): two callers pinned at a commit that is not this one.
  proof-standards-check:
    uses: murphy360/standards/.github/workflows/standards-check.yml@e8b03b27411d629eabd24099b7b6a059135ff52d
  proof-python-lint:
    uses: murphy360/standards/.github/workflows/python-lint.yml@c12e351e792fa20e20e84777d439d858ee000796
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pytest "ruff==0.6.9"
      - run: python3 -m pytest -q tests
  result:
    name: result
    if: always()
    needs: [lint, lint-changed, shell, workflows, standards, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          cat needs.json
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' needs.json
