# The standards repository checks itself with its own workflows, and tests its tools.
# `lint` runs python-lint in its default mode, all (every file), and `lint-changed` in mode changed (the files a
# change touches): this repository is clean, and a change to the workflow is tried in both modes before any project
# takes it. One run per ref (concurrency, below), and the new checks (check-pr-template, check-pre-commit-config)
# are turned on here to prove the opt-in flags work, since this repository now carries both files itself.
# `node`, `test-docker` and `image` run the other three workflows on the small projects in tests/fixtures, so that
# every workflow this repository ships runs here before a tag moves. `image` only builds: nothing is published here.
# `lint-pinned` runs python-lint on the fixture that pins its own, newer ruff (project-ruff).
# No ruff version is written here: tools/ruff_version.py reads the default from pyproject.toml.
# `types` runs type-check on this repository's own tools, `types-python` on a small project with a dependency to
# install, and `types-node` runs the TypeScript half on the Node fixture.
# `secret-scan` runs on the commits of the change and `secret-scan-history` on the whole history, so both are tried.
# `checks` is the one job a project copies from templates/ci.yml: the same quick checks through the actions under
# actions/, by local path, so a pull request proves its own actions.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    uses: ./.github/workflows/python-lint.yml
    with:
      format-check: true
      silencers: true   # every skip, type ignore and shellcheck disable here carries its reason
  lint-changed:
    uses: ./.github/workflows/python-lint.yml
    with:
      format-check: true
      mode: changed
      silencers: true
  # A project that pins its own ruff: the fixture's requirements-dev.txt names a newer release than the default.
  # The log prints the release and the file that names it, and with project-ruff the tool runs no other release:
  # it asks the ruff it found for its version first. The `hook` job proves the same on a file that only the
  # pinned release leaves as it is.
  lint-pinned:
    uses: ./.github/workflows/python-lint.yml
    with:
      format-check: true
      project-ruff: true
      working-directory: tests/fixtures/python-project
  shell:
    uses: ./.github/workflows/shell-lint.yml
    with:
      runs-on: '["ubuntu-latest"]'   # the JSON-list form a self-hosted runner uses
  workflows:
    uses: ./.github/workflows/actionlint.yml
  standards:
    uses: ./.github/workflows/standards-check.yml
    with:
      check-pr-template: true
      check-pre-commit-config: true
      check-ticket-template: true   # this repository files its tickets from its own template
      # check-templates stays off: this repository's AGENTS.md is its own text, not a copy of templates/AGENTS.md.
      # tests/test_templates.py runs this workflow's step with it on, against a project made from the templates.
      # check-ruff-version stays off too: this repository holds two ruff versions on purpose, the default and the
      # newer one its python-lint fixture pins. tests/test_ruff_version.py runs the step with it on.
  node:
    uses: ./.github/workflows/node-lint.yml
    with:
      format-check: true
      no-inline-config: true   # the opt-in is tried here: ESLint takes the flag, and the fixture has no disable comment
      silencers: true          # tried here too: the step passes the flag, and the fixture has no silencer
      working-directory: tests/fixtures/node-project
  test-docker:
    uses: ./.github/workflows/test-docker.yml
    with:
      context: tests/fixtures/docker-project
      file: tests/fixtures/docker-project/Dockerfile
      command: sh tests/fixtures/docker-project/test.sh
  image:
    uses: ./.github/workflows/image.yml
    with:
      image: standards-fixture
      context: tests/fixtures/docker-project
      file: tests/fixtures/docker-project/Dockerfile
      push: false   # both architectures build; no image is pushed
    permissions:
      contents: read
      packages: write   # image.yml asks for it, and a caller must grant what the workflow it calls asks for
  types:
    uses: ./.github/workflows/type-check.yml   # pyright on tools/; [tool.pyright] in pyproject.toml says why only tools/
  types-python:
    uses: ./.github/workflows/type-check.yml
    with:
      working-directory: tests/fixtures/python-project
      install-command: pip install -r requirements.txt   # without it the fixture's one import is a finding
  types-node:
    uses: ./.github/workflows/type-check.yml
    with:
      language: typescript
      working-directory: tests/fixtures/node-project
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
  secret-scan-history:
    uses: ./.github/workflows/secret-scan.yml
    with:
      full-history: true
  # The quick checks in one job, as templates/ci.yml has them. The first `checks` step runs the five default checks
  # on this repository. The second runs node-lint on the Node fixture, also when the first failed.
  # In a project take-ownership is the first step, before the checkout. Here it is a local action, which is only
  # there after the checkout. On a GitHub-hosted runner it does nothing in either place.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the secret scan reads the commits of the change
      - uses: ./actions/take-ownership
      - uses: ./actions/checks
        with:
          format-check: true
          silencers: true
          check-pr-template: true
          check-pre-commit-config: true
          check-ticket-template: true
      - if: ${{ !cancelled() }}
        uses: ./actions/checks
        with:
          checks: node-lint
          working-directory: tests/fixtures/node-project
          format-check: true
          no-inline-config: true
          silencers: true
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pytest && python3 tools/ruff_version.py --install
      - name: The gitleaks image, so the secret-scan test runs the real scan (it never pulls, and skips without it)
        run: docker pull "$(sh tools/image-ref.sh gitleaks)"
      - run: python3 -m pytest -q tests
  # The code-rules hook, built by pre-commit from this commit as a project would build it, on a scratch project that
  # breaks three rules: it must print what tools/code_rules.py prints. Then again on a project that pins a newer
  # ruff, with --project-ruff: the hook and the tool must run that release, which leaves alone a file the default
  # would re-format. It needs the network, so it is no pytest test.
  hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "pre-commit==4.7.0" && python3 tools/ruff_version.py --install
      - run: python3 tests/hook_project.py
  result:
    name: result
    if: always()
    needs: [lint, lint-changed, lint-pinned, shell, workflows, standards, node, test-docker, image, types, types-python, types-node, secret-scan, secret-scan-history, checks, tests, hook]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          cat needs.json
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' needs.json
