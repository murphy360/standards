# shellcheck on every tracked *.sh, pinned (no marketplace action on a moving branch).
#   jobs:
#     shell:
#       uses: murphy360/standards/.github/workflows/shell-lint.yml@v2
name: shell-lint
on:
  workflow_call:
    inputs:
      runs-on: {type: string, default: "ubuntu-latest", description: "a runner label, or a JSON list of labels (a self-hosted runner)"}
      shellcheck-version: {type: string, default: "v0.10.0"}
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - name: Take ownership of the previous job's files (a self-hosted runner)
        if: runner.environment == 'self-hosted'
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:3 chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 -r docker run --rm -v "$PWD:/mnt" -w /mnt \
            "koalaman/shellcheck:${{ inputs.shellcheck-version }}"
