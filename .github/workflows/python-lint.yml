# Python lint (tools/code_rules.py): ruff with the project's config plus the standard's rules (F, E4, E7, E9, B
# without B008, UP, SIM, I, and the complexity limits C901 and PLR0915), no noqa, every silencer with its reason, and
# the file-size limit. The standard is that every file is clean: every run checks every file in `paths`, and a
# finding anywhere fails. Each finding is printed with its line, its rule and how to fix it. Call it from a project:
#   jobs:
#     lint:
#       uses: murphy360/standards/.github/workflows/python-lint.yml@v3
#       with:
#         format-check: true
#         # paths: src tools  # only these directories (default: every tracked file); a project with debt says why
#         # silencers: false  # no check that every skip, xfail, type ignore and the like carries its reason
#         # project-ruff: false  # lint with the standard's default ruff, not the one the project pins
#
# A project with debt. There is no changed-files mode: a project that adopts the standard with findings left narrows
# `paths` to the directories that are clean, writes the reason beside it, and widens it as it pays the debt down.
#
# The project's ruff config. It may add rules, set the line length and exclude files. It cannot switch a standard
# rule off: a standard finding under per-file-ignores or lint.exclude is reported like any other, and an
# extend-per-file-ignores entry that names a standard rule is a problem. Every tracked Python file ruff does not
# check is printed by name on every run, and the last line counts them. That is information, not a failure.
#
# silencers. Each way to turn a check off in a file carries its reason: a pytest skip or xfail its reason=, a type
# ignore its error code and a comment, a pragma: no cover and a shellcheck disable a comment on the line above. The
# last line counts the silencers left. On by default since v3; silencers: false leaves it out.
#
# Which ruff. The project pins its own: a `ruff==<version>` line in requirements-dev.txt, in another
# requirements*.txt, or in a dependency group or an extra of its pyproject.toml, read in the directory the lint runs
# in (tools/ruff_version.py). Dependabot's pull request in the project then moves the pin, and that pull request is
# where the new release's findings show up, alone. A project that pins none gets the standard's default, which is
# written once, in this repository's pyproject.toml. The ruff-version input wins over both, and project-ruff: false
# takes the default even where the project pins one. The run prints the release and where it comes from. The
# project's pin is the default since v3.
name: python-lint
on:
  workflow_call:
    inputs:
      runs-on: {type: string, default: "ubuntu-latest", description: "a runner label, or a JSON list of labels (a self-hosted runner)"}
      ruff-version: {type: string, default: "", description: "one ruff release, by its version number; it wins over the project's pin (default: project-ruff decides)"}
      project-ruff: {type: boolean, default: true, description: "lint with the ruff the project pins (ruff==<version> in its requirements*.txt or pyproject.toml), and with the standard's default when it pins none; false: the standard's default"}
      python-version: {type: string, default: "3.12"}
      format-check: {type: boolean, default: false, description: "also check ruff format, on every file in paths"}
      paths: {type: string, default: "", description: "space-separated directories or files to check (default: every tracked file)"}
      silencers: {type: boolean, default: true, description: "a skip, an xfail, a type ignore, a pragma: no cover and a shellcheck disable each need a reason, .only fails, and the last line counts them"}
      working-directory: {type: string, default: "."}
      standards-ref:
        type: string
        default: ""
        description: "deprecated: the tools come from the commit this workflow is called at; read only if GitHub does not name it"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 15
    env:
      CODE_RULES_RUFF_VERSION: ${{ inputs.ruff-version }}  # read by tools/ruff_version.py and tools/code_rules.py
      CODE_RULES_PROJECT_RUFF: ${{ inputs.project-ruff }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # The tools come from the commit this workflow file was called at, so a workflow and its tools never disagree.
      # job.workflow_sha is that commit: what @v3 or @<sha> resolved to in a project, and the commit under test in
      # this repository's own ci.yml. It is read through toJSON because actionlint 1.7.12 does not know the property
      # yet. The checkout goes to the runner's temp directory, so nothing is added to the project's workspace.
      - name: The standards' tools, from the commit this workflow was called at
        working-directory: ${{ runner.temp }}
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          WORKFLOW_REF: ${{ fromJSON(toJSON(job)).workflow_ref }}
          STANDARDS_REF: ${{ inputs.standards-ref }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          repository="${WORKFLOW_REPOSITORY:-murphy360/standards}"
          ref="$WORKFLOW_SHA"
          if [ -z "$ref" ] && [ -n "$STANDARDS_REF" ]; then
            ref="$STANDARDS_REF"
            echo "::warning::GitHub did not name this workflow's commit (job.workflow_sha is empty): the tools come from standards-ref, $ref"
          elif [ -z "$ref" ]; then
            echo "::error::GitHub did not name this workflow's commit (job.workflow_sha is empty). Pass standards-ref: the ref this workflow is called at."
            exit 1
          fi
          rm -rf standards
          git init -q standards
          git -C standards fetch -q --no-tags --depth=1 "$SERVER_URL/$repository" "$ref"
          git -C standards checkout -q --detach FETCH_HEAD
          echo "standards tools: $repository@$(git -C standards rev-parse HEAD) (${WORKFLOW_REF:-standards-ref $ref})"
      - name: Take ownership of the previous job's files (a self-hosted runner)
        if: runner.environment == 'self-hosted'
        run: sh "$RUNNER_TEMP/standards/tools/steps/take-ownership.sh"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      # ruff, at one release: the ruff-version input when a caller passes it; with project-ruff, the release the
      # project pins; otherwise the standard's default, which is written once, in this repository's pyproject.toml.
      # The step prints the release and where it comes from. The lint step reads the same two values (the job's env).
      - name: ruff (the caller's version, the project's pin, or the standard's default)
        run: python3 "$RUNNER_TEMP/standards/tools/ruff_version.py" --install
      - name: Code rules (every file); ruff, no noqa, complexity, silencers, file size, format
        env:
          FORMAT_CHECK: ${{ inputs.format-check }}
          SILENCERS: ${{ inputs.silencers }}
          PATHS: ${{ inputs.paths }}
        run: bash "$RUNNER_TEMP/standards/tools/steps/code-rules.sh" python
