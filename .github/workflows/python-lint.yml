# Python lint (tools/code_rules.py): ruff with the project's config plus the standard complexity limits, and the
# file-size limit. Every file a pull request changes must be clean; the last line counts what is left in the files
# nobody has changed yet. Call it from a project:
#   jobs:
#     lint:
#       uses: murphy360/standards/.github/workflows/python-lint.yml@v1
#       with:
#         format-check: true
#         # mode: all        # once the report reads zero: every file, on every run
#
# mode: changed (the default) compares with a base. A pull request: the first parent of the merge commit the job
# checks out, which is the base branch as the pull request was merged with it (the pull request's base SHA when HEAD
# is not a merge commit). A push: the commit before the push. Any other event (a schedule, a dispatch, a new branch or tag) has no base: every file is reported and
# nothing fails. mode: all checks every file on every event.
name: python-lint
on:
  workflow_call:
    inputs:
      ruff-version: {type: string, default: "0.6.9", description: "the ruff release, pinned"}
      python-version: {type: string, default: "3.12"}
      format-check: {type: boolean, default: false, description: "also check ruff format (the changed files, or every file in mode all)"}
      mode: {type: string, default: "changed", description: "changed: every file the change touches must be clean; all: every file"}
      working-directory: {type: string, default: "."}
      standards-ref: {type: string, default: "v1", description: "the tag the project pins (the tools come from it)"}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The standards' tools, at the version the project pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: murphy360/standards
          ref: ${{ inputs.standards-ref }}
          path: .standards
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install "ruff==${{ inputs.ruff-version }}"
      - name: Code rules (ruff, complexity, file size)
        env:
          MODE: ${{ inputs.mode }}
          FORMAT_CHECK: ${{ inputs.format-check }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          tool="$GITHUB_WORKSPACE/.standards/tools/code_rules.py"
          format=()
          [ "$FORMAT_CHECK" = true ] || format=(--no-format)
          case "$MODE" in
            all) exec python3 "$tool" --all --no-format ;;  # the next step checks the format of every file
            changed) ;;
            *) echo "::error::mode is changed or all, not '$MODE'"; exit 1 ;;
          esac
          base=""
          if [ "$EVENT" = pull_request ]; then
            # The merge commit the job checked out says what the pull request was merged with: its first parent.
            # The base branch may have moved on since; comparing with it would count files this PR never touched.
            parents=$(git cat-file -p HEAD | sed -n 's/^parent //p')
            first=$(printf '%s\n' "$parents" | head -1)
            if [ "$(printf '%s\n' "$parents" | grep -c .)" -eq 2 ] \
              && git fetch --no-tags --depth=1 origin "$first"; then
              echo "code rules base: $first, the first parent of the merge commit $(git rev-parse HEAD)"
              CODE_RULES_BASE="$first" exec python3 "$tool" "${format[@]}"
            fi
            base="$PR_BASE"
            echo "code rules base: $base, the pull request's base (HEAD is not a merge commit, or its parent did not fetch)"
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            base="$BEFORE"  # all zeros: a new branch or tag, nothing before it
            echo "code rules base: $base, the commit before the push"
          fi
          if [ -z "$base" ]; then
            echo "::notice::no base to compare with on a $EVENT event: every file is reported, nothing fails"
            exec python3 "$tool" --all --report-only "${format[@]}"
          fi
          git fetch --no-tags --depth=1 origin "$base" || echo "::warning::could not fetch the base $base"
          CODE_RULES_BASE="$base" exec python3 "$tool" "${format[@]}"
      - name: Formatting (every file)
        if: inputs.format-check && inputs.mode == 'all'
        run: ruff format --check .
