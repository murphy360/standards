# THROWAWAY (ticket #33): one finding for standards-check (an action that is not pinned) and one for actionlint (a
# property that does not exist). It never runs: it is only dispatched by hand, and it is removed in the next commit.
name: planted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: echo "${{ github.nope }}"
