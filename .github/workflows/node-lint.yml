# JavaScript and TypeScript lint with the ratchet (tools/code_rules.py --eslint): the project's ESLint and
# eslint.config.* plus the standard complexity limits, and the file-size limit, against the project's
# code_rules_baseline.json. ESLint and Prettier come from the project's own devDependencies (its lockfile pins them
# and Dependabot updates them). Call it from a project:
#   jobs:
#     lint:
#       uses: murphy360/standards/.github/workflows/node-lint.yml@v1
#       with: {format-check: true}
name: node-lint
on:
  workflow_call:
    inputs:
      node-version: {type: string, default: "22"}
      format-check: {type: boolean, default: false, description: "also run prettier --check"}
      working-directory: {type: string, default: "."}
      ruff-version: {type: string, default: "0.6.9", description: "for a project that also tracks Python files"}
      standards-ref: {type: string, default: "v1", description: "the tag the project pins (the tools come from it)"}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The standards' tools, at the version the project pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: murphy360/standards
          ref: ${{ inputs.standards-ref }}
          path: .standards
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: pip install "ruff==${{ inputs.ruff-version }}"
      - run: npm ci
      - name: Code rules (ESLint, complexity, file size) against the ratchet baseline
        run: python3 "$GITHUB_WORKSPACE/.standards/tools/code_rules.py" --eslint
      - name: Formatting
        if: inputs.format-check
        run: npx --no-install prettier --check . "!.standards/**"
