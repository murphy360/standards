# JavaScript and TypeScript lint (tools/code_rules.py --eslint): the project's ESLint and eslint.config.* plus the
# standard complexity limits (complexity 15, 60 statements) and the file-size limit. An eslint-disable comment hides
# nothing and is a problem, and every silencer carries its reason. The standard is that every file is clean: every
# run checks every file in `paths`, and a finding anywhere fails. Each finding is printed with its line, its rule and
# how to fix it. format-check adds prettier --check on every file in `paths`. ESLint and Prettier come from the
# project's devDependencies: its lockfile pins them and Dependabot updates them.
# A project that also tracks Python files gets the ruff rules too, and its ruff config cannot switch one off
# (python-lint.yml says how).
# Call it from a project:
#   jobs:
#     lint:
#       uses: murphy360/standards/.github/workflows/node-lint.yml@v3
#       with:
#         format-check: true
#         # paths: src        # only these directories (default: every tracked file); a project with debt says why
#         # no-inline-config: false  # let an eslint-disable comment hide a finding
#         # silencers: false         # no check that a .skip in a test carries its reason
#         # project-ruff: false      # Python files are linted with the standard's default ruff, not the project's
#
# A project with debt. There is no changed-files mode: it narrows `paths` to the directories that are clean, with the
# reason beside it, and widens it as it pays the debt down.
name: node-lint
on:
  workflow_call:
    inputs:
      runs-on: {type: string, default: "ubuntu-latest", description: "a runner label, or a JSON list of labels (a self-hosted runner)"}
      node-version: {type: string, default: "22"}
      format-check: {type: boolean, default: false, description: "also check prettier, on every file in paths"}
      paths: {type: string, default: "", description: "space-separated directories or files to check (default: every tracked file)"}
      no-inline-config: {type: boolean, default: true, description: "run ESLint with --no-inline-config, and fail on each eslint-disable comment"}
      silencers: {type: boolean, default: true, description: "each silencer needs its reason (python-lint.yml lists them); in a test file a .skip needs a comment above it and .only fails"}
      working-directory: {type: string, default: "."}
      ruff-version: {type: string, default: "", description: "for a project that also tracks Python files: one ruff release, by its version number; it wins over the project's pin (default: project-ruff decides)"}
      project-ruff: {type: boolean, default: true, description: "lint Python files with the ruff the project pins (python-lint.yml says where), and with the standard's default when it pins none; false: the standard's default"}
      standards-ref:
        type: string
        default: ""
        description: "deprecated: the tools come from the commit this workflow is called at; read only if GitHub does not name it"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 15
    env:
      CODE_RULES_RUFF_VERSION: ${{ inputs.ruff-version }}  # read by tools/ruff_version.py and tools/code_rules.py
      CODE_RULES_PROJECT_RUFF: ${{ inputs.project-ruff }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # The tools come from the commit this workflow file was called at, so a workflow and its tools never disagree.
      # job.workflow_sha is that commit: what @v3 or @<sha> resolved to in a project, and the commit under test in
      # this repository's own ci.yml. It is read through toJSON because actionlint 1.7.12 does not know the property
      # yet. The checkout goes to the runner's temp directory, so nothing is added to the project's workspace.
      - name: The standards' tools, from the commit this workflow was called at
        working-directory: ${{ runner.temp }}
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          WORKFLOW_REF: ${{ fromJSON(toJSON(job)).workflow_ref }}
          STANDARDS_REF: ${{ inputs.standards-ref }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          repository="${WORKFLOW_REPOSITORY:-murphy360/standards}"
          ref="$WORKFLOW_SHA"
          if [ -z "$ref" ] && [ -n "$STANDARDS_REF" ]; then
            ref="$STANDARDS_REF"
            echo "::warning::GitHub did not name this workflow's commit (job.workflow_sha is empty): the tools come from standards-ref, $ref"
          elif [ -z "$ref" ]; then
            echo "::error::GitHub did not name this workflow's commit (job.workflow_sha is empty). Pass standards-ref: the ref this workflow is called at."
            exit 1
          fi
          rm -rf standards
          git init -q standards
          git -C standards fetch -q --no-tags --depth=1 "$SERVER_URL/$repository" "$ref"
          git -C standards checkout -q --detach FETCH_HEAD
          echo "standards tools: $repository@$(git -C standards rev-parse HEAD) (${WORKFLOW_REF:-standards-ref $ref})"
      - name: Take ownership of the previous job's files (a self-hosted runner)
        if: runner.environment == 'self-hosted'
        run: sh "$RUNNER_TEMP/standards/tools/steps/take-ownership.sh"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      # ruff, at one release: the ruff-version input when a caller passes it; with project-ruff, the release the
      # project pins; otherwise the standard's default, which is written once, in this repository's pyproject.toml.
      # The step prints the release and where it comes from. The lint step reads the same two values (the job's env).
      - name: ruff (the caller's version, the project's pin, or the standard's default)
        run: python3 "$RUNNER_TEMP/standards/tools/ruff_version.py" --install
      - run: npm ci
      - name: Code rules (every file); ESLint, complexity, silencers, file size, prettier
        env:
          FORMAT_CHECK: ${{ inputs.format-check }}
          NO_INLINE_CONFIG: ${{ inputs.no-inline-config }}
          SILENCERS: ${{ inputs.silencers }}
          PATHS: ${{ inputs.paths }}
        run: bash "$RUNNER_TEMP/standards/tools/steps/code-rules.sh" node
