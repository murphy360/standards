# Secret scan: gitleaks over the commits of a change, so a credential that slipped past the pre-commit hook is
# stopped before it is merged. Call it from a project:
#   jobs:
#     secret-scan:
#       uses: murphy360/standards/.github/workflows/secret-scan.yml@v2
#       # with:
#       #   full-history: true  # every commit, not only this change's: once when adopting, or on a schedule
#
# What is scanned. A pull request: its own commits, from the first parent of the merge commit the job checks out
# (the base branch as the pull request was merged with it) to HEAD. A push: the commits it added, from the commit
# before the push. With no base (a new branch or tag, a schedule, a dispatch, a base that a force push removed) or
# with full-history, every commit HEAD reaches. The run prints which it used. A merge commit's own changes (a
# conflict resolution) are not scanned in the pull request; the commit that lands on the base branch is, on its push.
#
# The history. The checkout fetches all of it (fetch-depth: 0). The range is only known against its base, and in a
# shallow clone the oldest commit looks as if it added every file, so old findings would be blamed on the change.
#
# A finding prints the file, the line, the rule and the commit, never the secret or the line that holds it. A secret
# that reached GitHub is compromised: revoke it first. Removing it in a later commit does not clear the run, since
# the earlier commit still holds it. A project's own rules and allowlist go in .gitleaks.toml at its root (start it
# with `[extend]` and `useDefault = true`, or the default rules are gone), and one accepted finding goes in
# .gitleaksignore by its fingerprint. Both are read from the commit under test, so they are reviewed with the change.
#
# gitleaks runs from its official image, pinned by digest, at the version the pre-commit hook pins
# (templates/pre-commit-config.yaml; tests/test_secret_scan.py keeps the two in step). No licence key is needed.
name: secret-scan
on:
  workflow_call:
    inputs:
      runs-on: {type: string, default: "ubuntu-latest", description: "a runner label, or a JSON list of labels (a self-hosted runner)"}
      full-history: {type: boolean, default: false, description: "scan every commit HEAD reaches, not only the commits of this change"}
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Take ownership of the previous job's files (a self-hosted runner)
        if: runner.environment == 'self-hosted'
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:3 chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history: see "The history" above
      - name: Scan the commits of this change (or the whole history) for secrets
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          FULL_HISTORY: ${{ inputs.full-history }}
        run: |
          set -euo pipefail
          base=""
          if [ "$FULL_HISTORY" = true ]; then
            echo "secret scan: full-history is on"
          elif [ "$EVENT" = pull_request ]; then
            # The merge commit the job checked out says what the pull request was merged with: its first parent.
            # The base branch may have moved on since; its newer commits are not this pull request's.
            if git rev-parse -q --verify 'HEAD^2' > /dev/null; then
              base="$(git rev-parse 'HEAD^1')"
            else
              base="$PR_BASE"
            fi
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            base="$BEFORE"  # all zeros: a new branch or tag, nothing before it
          fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2> /dev/null; then
            echo "::notice::the base $base is not in this clone (a force push removed it)"
            base=""
          fi
          if [ -n "$base" ]; then
            range="$base..HEAD"
            echo "secret scan: $range, $(git rev-list --count --no-merges "$range") commit(s) of this $EVENT"
          else
            range="HEAD"
            [ "$FULL_HISTORY" = true ] || echo "::notice::no base to compare with on a $EVENT event"
            echo "secret scan: the whole history of $(git rev-parse HEAD), $(git rev-list --count HEAD) commit(s)"
          fi

          # One line per finding, and nothing of the secret: gitleaks' own verbose output also prints the line of
          # source the secret sits in, which can hold a second one.
          work="${RUNNER_TEMP:-$(mktemp -d)}/secret-scan"
          mkdir -p "$work"
          cat > "$work/findings.tmpl" << 'EOF'
          {{ range . -}}
          ::error file={{ .File }},line={{ .StartLine }},title=secret-scan::{{ .RuleID }} at {{ .File }}:{{ .StartLine }}, commit {{ .Commit | trunc 7 }}, fingerprint {{ .Fingerprint }}
          {{ end -}}
          EOF
          status=0
          docker run --rm -v "$PWD:/repo:ro" -v "$work:/tmpl:ro" -w /repo "$GITLEAKS_IMAGE" git . \
            --redact --no-banner --log-opts="$range" \
            --report-format template --report-template /tmpl/findings.tmpl --report-path - \
            2> "$work/gitleaks.log" || status=$?
          cat "$work/gitleaks.log"
          # gitleaks exits 0 when git itself failed (it logs the error and reports "no leaks found"), so an error
          # line fails the run: a scan that read nothing proves nothing.
          if sed 's/\x1b\[[0-9;]*m//g' "$work/gitleaks.log" | grep -Eq '^[^ ]+ (ERR|FTL) '; then
            echo "::error::gitleaks reported an error (above), so the scan proves nothing"
            exit 1
          fi
          case "$status" in
            0) echo "secret scan: no finding" ;;
            1)
              echo "A secret that reached GitHub is compromised: revoke it first, then take it out of the code."
              echo "The commit that added it still holds it, so the run stays red until its fingerprint (above) is"
              echo "in .gitleaksignore. A false positive goes there too, or in .gitleaks.toml, with its reason."
              exit 1
              ;;
            *)
              echo "::error::gitleaks did not run (exit $status)"
              exit "$status"
              ;;
          esac
