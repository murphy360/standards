# The project's tests inside its own image: build it (target optional) and run the test command in it.
#   jobs:
#     test:
#       uses: murphy360/standards/.github/workflows/test-docker.yml@v1
#       with: {command: "pytest -q"}
name: test-docker
on:
  workflow_call:
    inputs:
      command: {type: string, required: true, description: "run inside the image, from the mounted checkout"}
      context: {type: string, default: "."}
      file: {type: string, default: "Dockerfile"}
      target: {type: string, default: ""}
      workdir: {type: string, default: "/src", description: "where the checkout is mounted in the container"}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          load: true
          tags: test-image:${{ github.sha }}
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - name: Tests
        run: docker run --rm -v "$PWD:${{ inputs.workdir }}" -w "${{ inputs.workdir }}" "test-image:${{ github.sha }}" sh -c "${{ inputs.command }}"
