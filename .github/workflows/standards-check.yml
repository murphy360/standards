# Does the calling project follow the standards? Dependabot covers its ecosystems, every action is pinned to a
# commit SHA, and CLAUDE.md exists (tools/check_standards.py).
#   jobs:
#     standards:
#       uses: murphy360/standards/.github/workflows/standards-check.yml@v1
name: standards-check
on:
  workflow_call:
    inputs:
      standards-ref: {type: string, default: "v1", description: "the tag the project pins (the tools come from it)"}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The standards' tools, at the version the project pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: murphy360/standards
          ref: ${{ inputs.standards-ref }}
          path: .standards
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 .standards/tools/check_standards.py
