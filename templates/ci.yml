# A project's CI from the standards: copy to .github/workflows/ci.yml, keep the jobs that apply, pin @v2.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# One run per ref. A pull request's superseded run is cancelled, so a second push never waits behind the first; a
# push to main always finishes what it started. A job that calls a reusable workflow cannot set its own
# timeout-minutes (GitHub refuses it), so each reusable workflow's own job carries one instead; that is what stops
# a stuck job holding a runner for six hours.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  standards:
    uses: murphy360/standards/.github/workflows/standards-check.yml@v2
    # with:
    #   check-pr-template: true        # also requires .github/pull_request_template.md
    #   check-pre-commit-config: true  # also requires .pre-commit-config.yaml
  lint:
    uses: murphy360/standards/.github/workflows/python-lint.yml@v2
    with:
      format-check: true
      # mode: changed  # default `all`: every file must be clean. `changed`: every file a change touches, while
      #                # `code_rules.py --all` still lists findings
      format-only: ${{ contains(github.event.pull_request.labels.*.name, 'format-only') }}
  shell:
    uses: murphy360/standards/.github/workflows/shell-lint.yml@v2
  workflows:
    uses: murphy360/standards/.github/workflows/actionlint.yml@v2
  test:
    uses: murphy360/standards/.github/workflows/test-docker.yml@v2
    with:
      command: "pytest -q"
  image:
    needs: [lint, test]
    uses: murphy360/standards/.github/workflows/image.yml@v2
    with:
      image: my-service
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
  # The one job a ruleset requires (templates/rulesets/main.json): whichever of the above is slow, cancelled or
  # skipped, this is the fixed name a branch protection rule points at.
  result:
    name: result
    if: always()
    needs: [standards, lint, shell, workflows, test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          cat needs.json
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' needs.json
