# A project's CI from the standards: copy to .github/workflows/ci.yml, keep the jobs that apply, pin @v2.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standards:
    uses: murphy360/standards/.github/workflows/standards-check.yml@v2
  lint:
    uses: murphy360/standards/.github/workflows/python-lint.yml@v2
    with:
      format-check: true
      # mode: changed  # default `all`: every file must be clean. `changed`: every file a change touches, while
      #                # `code_rules.py --all` still lists findings
      format-only: ${{ contains(github.event.pull_request.labels.*.name, 'format-only') }}
  shell:
    uses: murphy360/standards/.github/workflows/shell-lint.yml@v2
  workflows:
    uses: murphy360/standards/.github/workflows/actionlint.yml@v2
  test:
    uses: murphy360/standards/.github/workflows/test-docker.yml@v2
    with:
      command: "pytest -q"
  image:
    needs: [lint, test]
    uses: murphy360/standards/.github/workflows/image.yml@v2
    with:
      image: my-service
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
