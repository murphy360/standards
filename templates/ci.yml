# A project's CI from the standards: copy to .github/workflows/ci.yml, keep the jobs that apply, pin @v2.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# One run per ref. A pull request's superseded run is cancelled, so a second push never waits behind the first; a
# push to main always finishes what it started. A job that calls a reusable workflow cannot set its own
# timeout-minutes (GitHub refuses it), so each reusable workflow's own job carries one instead; that is what stops
# a stuck job holding a runner for six hours.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  standards:
    uses: murphy360/standards/.github/workflows/standards-check.yml@v2
    # with:
    #   check-pr-template: true        # also requires .github/pull_request_template.md
    #   check-pre-commit-config: true  # also requires .pre-commit-config.yaml
    #   check-ticket-template: true    # also requires an issue template in .github/ISSUE_TEMPLATE
    #   check-templates: true          # the shared text of AGENTS.md is the template's (tools/sync_templates.py)
    #   check-agent-settings: true     # also requires .claude/settings.json with the guard hook
  lint:
    uses: murphy360/standards/.github/workflows/python-lint.yml@v2
    with:
      format-check: true
      # mode: changed  # default `all`: every file must be clean. `changed`: every file a change touches, while
      #                # `pre-commit run --all-files` still lists findings
      format-only: ${{ contains(github.event.pull_request.labels.*.name, 'format-only') }}
      # silencers: true  # a skip, an xfail, a type ignore, a `# pragma: no cover` and a `# shellcheck disable=`
      #                  # each carry a reason, and the last line counts them
  # A JavaScript or TypeScript project uses node-lint instead of python-lint, or as a job of its own:
  # node:
  #   uses: murphy360/standards/.github/workflows/node-lint.yml@v2
  #   with:
  #     format-check: true
  #     # mode: changed
  #     # no-inline-config: true  # an eslint-disable comment hides nothing and is a problem
  #     # silencers: true         # a `.skip` in a test carries a reason, and `.only` is a problem
  shell:
    uses: murphy360/standards/.github/workflows/shell-lint.yml@v2
  workflows:
    uses: murphy360/standards/.github/workflows/actionlint.yml@v2
  secret-scan:
    uses: murphy360/standards/.github/workflows/secret-scan.yml@v2
    # with:
    #   full-history: true  # every commit, not only this change's: once when adopting, or on a schedule
  test:
    uses: murphy360/standards/.github/workflows/test-docker.yml@v2
    with:
      command: "pytest -q"
  image:
    needs: [lint, test]
    uses: murphy360/standards/.github/workflows/image.yml@v2
    with:
      image: my-service
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
  # The one job a ruleset requires (templates/rulesets/main.json): whichever of the above is slow, cancelled or
  # skipped, this is the fixed name a branch protection rule points at.
  result:
    name: result
    if: always()
    needs: [standards, lint, shell, workflows, secret-scan, test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          cat needs.json
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' needs.json
