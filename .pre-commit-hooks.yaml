# The code rules as pre-commit hooks, so that a project runs before a push what CI runs after it. A project names
# this repository in its .pre-commit-config.yaml at a commit SHA (templates/pre-commit-config.yaml). pre-commit
# installs this repository into the hook's own environment (pyproject.toml): the modules under tools/ and the
# standard's default ruff. Nothing is installed on the machine, and a ruff it already has is not used.
# Every tracked file is checked on every run, as CI checks it; the names of the staged files are not passed.
# A project changes `args` only to say what its lint job's inputs say: `--paths`, `--no-format`, `--no-silencers`,
# `--no-project-ruff`, `--ruff-version <version>`. The hook runs the ruff the project pins (`ruff==<version>` in its
# requirements), as the lint job does: it installs that release into its own environment on the first run, so a
# pull request that moves the pin moves the hook with CI.
- id: code-rules
  name: code rules (ruff, complexity, no noqa, file size, format)
  description: What python-lint runs. Every file is clean; each finding is printed with its line, rule and fix.
  entry: code-rules
  language: python
  pass_filenames: false
# A JavaScript or TypeScript project: what node-lint runs. ESLint comes from the project's node_modules (npm ci),
# so node is on the machine already. A project whose node-lint has format-check on adds --prettier to the args.
- id: code-rules-node
  name: code rules (ESLint, complexity, file size)
  description: What node-lint runs. The project's own ESLint plus the standard limits, on every tracked file.
  entry: code-rules
  args: [--eslint, --no-format]
  language: python
  pass_filenames: false
# The layering contracts of the project's .importlinter: what the `layering` check of the checks action runs. A
# project without an .importlinter passes. It runs in the root of the checkout, so a project whose contracts are in
# a subdirectory (the action's working-directory) passes `--config <dir>/.importlinter` in `args`.
- id: layering
  name: layering contracts (.importlinter)
  description: What the layering check runs. Every forbidden import fails, and every allowed one names its ticket.
  entry: layering
  language: python
  pass_filenames: false
# The glossary, as a fixer, like ruff-format: it writes docs/GLOSSARY.md from docs/terms.yaml, and pre-commit fails
# the run because a file changed; the next run passes. The `glossary` check of the checks action runs the same tool
# without --write, so CI only checks. A project without a terms file passes. A project whose docs are in a
# subdirectory sets `args: [--write, --terms, <dir>/docs/terms.yaml]`; `args: []` makes the hook only check.
- id: glossary
  name: glossary (docs/terms.yaml writes docs/GLOSSARY.md)
  description: Writes the page from the terms. A name defined twice, or a file it cannot read, fails it.
  entry: glossary
  args: [--write]
  language: python
  pass_filenames: false
