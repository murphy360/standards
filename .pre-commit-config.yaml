# From templates/pre-commit-config.yaml. Every hook pinned to a commit SHA, its version in a comment, at the pins
# the workflows use: ruff and ruff format at the standard's default ruff (pyproject.toml); shellcheck at
# shell-lint.yml's (0.11.0); actionlint at actionlint.yml's (1.7.12); gitleaks at secret-scan.yml's (8.30.1), built
# from source at that commit, so a staged secret stops the commit. One difference from the template: the code rules
# are a local hook.
#
#   pip install pre-commit && pre-commit install   # once per checkout
#   pre-commit run --all-files                     # every hook, on every file: the one command before a push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 75b98813cfb7e663870a28c74366a1e99d7bfe79  # v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # The code rules of this checkout, not of a commit this file names: this repository's CI runs the tools of the
  # pull request, so its hook does too. A project takes the hook from this repository at a commit SHA instead
  # (templates/pre-commit-config.yaml). No ruff is named here: with --project-ruff the tool runs the release this
  # project pins, and it pins none, so that is the standard's default (pyproject.toml). The tool installs it into the
  # hook's environment on the first run.
  - repo: local
    hooks:
      - id: code-rules
        name: code rules (ruff, complexity, no noqa, file size, format)
        entry: python3 tools/code_rules.py --all --silencers --project-ruff
        language: python
        pass_filenames: false
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1 (shellcheck 0.11.0)
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
